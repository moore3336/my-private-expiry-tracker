<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои продукты</title><style>body{margin:0;background:#101827;color:#eef4ff;font:16px system-ui;padding:22px}main{max-width:850px;margin:auto}.panel{background:#1b293d;padding:20px;border-radius:14px;margin:18px 0}input,button{padding:12px;border-radius:8px;margin:5px;font:inherit}input{background:#101c2c;color:white;border:1px solid #52647d}button{background:#79b5ff;border:0;cursor:pointer}.row{display:flex;justify-content:space-between;border-bottom:1px solid #40516b;padding:12px 0;gap:12px}.muted{color:#a9b9ce}</style><main><header style="display:flex;justify-content:space-between;align-items:center"><div><h1>🥫 Сроки годности</h1><p id="who" class="muted"></p></div><button id="logout">Выйти</button></header><section class="panel"><h2>Добавить продукт</h2><form id="add"><input name="name" placeholder="Название" required maxlength="160"><input name="exp_date" type="date" required><input name="category" placeholder="Категория"><button>Добавить</button></form></section><section class="panel"><h2>Мои продукты</h2><div id="items">Загрузка…</div></section></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){location='/login';throw Error('Войдите')}let j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}async function load(){let m=await api('/api/me');who.textContent='Пользователь: '+m.user.username+(m.user.is_admin?' · администратор':'');let a=await api('/api/products');items.innerHTML=a.length?a.map(x=>'<div class="row"><span><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.category||'Без категории')+' · до '+String(x.exp_date).slice(0,10)+'</span></span><button onclick="del(\''+x.id+'\')">Удалить</button></div>').join(''):'Список пока пуст' }async function del(id){await api('/api/products/'+id,{method:'DELETE'});load()}add.onsubmit=async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(add)))});add.reset();load()}catch(x){alert(x.message)}};logout.onclick=async()=>{await api('/api/logout',{method:'POST'});location='/login'};load().catch(e=>alert(e.message))</script></html>
