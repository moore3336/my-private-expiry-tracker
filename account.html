<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Мой аккаунт — Трекер</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232563eb'/%3E%3Cpath d='M18 34l9 9 20-22' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:850px;margin:34px auto;padding:0 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:1px solid #e2e8f0;background:white;color:#172033;padding:10px 14px;border-radius:11px;text-decoration:none;font-weight:650}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 12px 35px #0f172a0d}.profile{display:flex;align-items:center;gap:15px}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#2563eb,#06b6d4);display:grid;place-items:center;color:white;font-size:27px}.muted{color:#64748b}.creator{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:99px;font-weight:800;font-size:.8rem}.entry{padding:13px 0;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:15px}.entry:last-child{border:0}.entry b{display:block}.entry small{color:#64748b}@media(max-width:560px){.entry{display:block}.entry small{display:block;margin-top:3px}}

:root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark} :root[data-theme="dark"] body{background:#0b1220!important;color:#e5edf8!important} :root[data-theme="dark"] .card,:root[data-theme="dark"] .p,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .widget,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .ticket,:root[data-theme="dark"] .item,:root[data-theme="dark"] .entry{background:#131d2e!important;color:#e5edf8!important;border-color:#29384e!important;box-shadow:0 10px 28px #0003} :root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#182438!important;color:#e5edf8!important;border-color:#35465f!important} :root[data-theme="dark"] .btn,:root[data-theme="dark"] .tabs button{background:#182438;color:#e5edf8;border-color:#35465f} :root[data-theme="dark"] .muted,:root[data-theme="dark"] .hint,:root[data-theme="dark"] .sub{color:#9aabc2!important} :root[data-theme="dark"] .msg{background:#202d42!important;color:#e5edf8} :root[data-theme="dark"] .msg.user{background:#18345a!important} :root[data-theme="dark"] .msg.admin{background:#163b32!important} :root[data-theme="dark"] .msg.ai{background:#30264d!important} .global-theme{position:fixed;right:16px;top:14px;z-index:1200;border:1px solid #94a3b8;background:#fff;color:#172033;border-radius:999px;padding:9px 13px;font:600 14px system-ui;box-shadow:0 5px 18px #0002;cursor:pointer} :root[data-theme="dark"] .global-theme{background:#182438;color:#e5edf8;border-color:#465a75}

/* Unified modern visual language */
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:-.01em;background:radial-gradient(ellipse at 5% 0%,#dbeafe 0,transparent 35%),radial-gradient(ellipse at 95% 5%,#f3e8ff 0,transparent 30%),#f3f6fb!important}body:has(.global-theme){} .card,.p{border-radius:22px!important;box-shadow:0 18px 48px #17255412!important}button,.btn{border-radius:13px!important;font-weight:700!important;transition:transform .16s ease,box-shadow .16s ease!important}button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #635bff20}input,textarea,select{border-radius:13px!important}h1,h2{letter-spacing:-.035em} :root[data-theme="dark"] body{background:radial-gradient(ellipse at 5% 0%,#1e2c52 0,transparent 35%),radial-gradient(ellipse at 95% 5%,#30224a 0,transparent 30%),#0b1220!important;color:#e5edf8!important} @media(max-width:600px){.wrap{padding-top:62px!important}.p{padding:22px!important}}
</style></head><body><button id="globalTheme" class="global-theme" type="button">🌙 Тёмная тема</button><main class="wrap">
<div class="top"><h1>👤 Мой аккаунт</h1><a class="btn" href="/app">← Вернуться к продуктам</a></div><p class="muted" style="text-align:center">★ Сайт создан moore</p>
<section class="card"><div class="profile"><div class="avatar">◈</div><div><h2 id="username" style="margin:0">Загрузка…</h2><div id="role"></div><div id="email" class="muted"></div><small id="created" class="muted"></small></div></div></section>
<section class="card"><h2 style="margin-top:0">История действий</h2><p class="muted">Последние 200 событий вашего аккаунта</p><div id="history"></div><p id="empty" class="muted" hidden>История пока пуста. Добавляйте или удаляйте продукты, чтобы события появились здесь.</p></section><p id="error" class="muted"></p>
</main><script>
(async function(){const $=id=>document.getElementById(id);const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));try{const results=await Promise.all([fetch("/api/me"),fetch("/api/history")]);if(results[0].status===401){location.href="/login";return}if(!results[0].ok||!results[1].ok)throw new Error("Не удалось загрузить данные аккаунта");const user=(await results[0].json()).user;const history=(await results[1].json()).history||[];$("username").textContent=user.username;$("role").innerHTML=user.is_developer?'<span class="creator">★ СОЗДАТЕЛЬ САЙТА</span>':'<span class="muted">Пользователь</span>';$("email").textContent=user.email||"Email не указан";$("created").textContent=user.created_at?"Аккаунт создан: "+new Date(user.created_at).toLocaleDateString("ru-RU"):"";$("history").innerHTML=history.map(item=>'<div class="entry"><div><b>'+esc(item.action)+'</b>'+(item.product_name?'<div>'+esc(item.product_name)+'</div>':"")+(item.details?'<small>'+esc(item.details)+'</small>':"")+'</div><small>'+new Date(item.created_at).toLocaleString("ru-RU")+'</small></div>').join("");$("empty").hidden=history.length>0}catch(error){$("error").textContent=error.message}})();
</script><script>(()=>{const root=document.documentElement,key='expiry-theme';let t=localStorage.getItem(key)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t;const b=document.getElementById('globalTheme');const paint=()=>{b.textContent=root.dataset.theme==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'};paint();b.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem(key,root.dataset.theme);paint()})})();</script></body></html>
