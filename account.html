</style><style id="account-theme-style">#accountThemeToggle{position:fixed;right:16px;top:14px;z-index:1300;border:1px solid #94a3b8;background:#fff;color:#172033;border-radius:999px;padding:9px 13px;font:700 14px system-ui;box-shadow:0 5px 18px #0002;cursor:pointer}:root[data-theme="dark"] #accountThemeToggle{background:#182438;color:#e5edf8;border-color:#465a75}body.account-themed{background-image:var(--account-page-bg)!important;background-size:cover!important;background-attachment:fixed!important}body.account-themed.theme-animated{background-size:220% 220%!important;animation:accountThemeDrift 22s ease infinite}@keyframes accountThemeDrift{0%,100%{background-position:0% 40%}50%{background-position:100% 60%}}@media(prefers-reduced-motion:reduce){body.account-themed.theme-animated{animation:none!important}}#globalTheme.global-theme{display:grid!important;position:fixed!important;right:14px!important;top:14px!important;z-index:1400!important;width:38px!important;height:38px!important;min-width:38px!important;padding:0!important;margin:0!important;place-items:center!important;border:1px solid var(--line,#94a3b8)!important;border-radius:50%!important;background:var(--surface,#fff)!important;color:var(--text,#172033)!important;font:600 18px/1 system-ui!important;box-shadow:0 4px 14px #0002!important;cursor:pointer!important;transform:none!important}#globalTheme.global-theme:hover{transform:scale(1.04)!important;box-shadow:0 5px 16px #0003!important}#globalTheme.global-theme:disabled{opacity:.65;cursor:wait}:root[data-theme="dark"] #globalTheme.global-theme{background:#182438!important;color:#e5edf8!important;border-color:#465a75!important}:root:not([data-theme="dark"]) #globalTheme.global-theme{background:#fff!important;color:#172033!important;border-color:#94a3b8!important}</style></head><body><main class="wrap">
<div class="top"><h1>👤 Мой аккаунт</h1><a class="btn" href="/app">← Вернуться к продуктам</a></div><p class="muted" style="text-align:center">★ Сайт создан moore</p>
<section class="card"><div class="profile"><div class="avatar">◈</div><div><h2 id="username" style="margin:0">Загрузка…</h2><div id="role"></div><div id="email" class="muted"></div><small id="created" class="muted"></small></div></div></section>
<section class="card"><h2 style="margin-top:0">История действий</h2><p class="muted">Последние 200 событий вашего аккаунта</p><div id="history"></div><p id="empty" class="muted" hidden>История пока пуста. Добавляйте или удаляйте продукты, чтобы события появились здесь.</p></section><p id="error" class="muted"></p>
</main><script>
(async function(){const $=id=>document.getElementById(id);const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));try{const results=await Promise.all([fetch("/api/me"),fetch("/api/history")]);if(results[0].status===401){location.href="/login";return}if(!results[0].ok||!results[1].ok)throw new Error("Не удалось загрузить данные аккаунта");const user=(await results[0].json()).user;const history=(await results[1].json()).history||[];$("username").textContent=user.username;$("role").innerHTML=user.is_developer?'<span class="creator">★ СОЗДАТЕЛЬ САЙТА</span>':'<span class="muted">Пользователь</span>';$("email").textContent=user.email||"Email не указан";$("created").textContent=user.created_at?"Аккаунт создан: "+new Date(user.created_at).toLocaleDateString("ru-RU"):"";$("history").innerHTML=history.map(item=>'<div class="entry"><div><b>'+esc(item.action)+'</b>'+(item.product_name?'<div>'+esc(item.product_name)+'</div>':"")+(item.details?'<small>'+esc(item.details)+'</small>':"")+'</div><small>'+new Date(item.created_at).toLocaleString("ru-RU")+'</small></div>').join("");$("empty").hidden=history.length>0}catch(error){$("error").textContent=error.message}})();
</script><button id="globalTheme" class="global-theme" type="button" aria-label="Переключить тему" title="Переключить тему">🌙</button><script id="account-theme-loader">(()=>{const root=document.documentElement,btn=document.getElementById('globalTheme'),key='expiry-theme',bgs={aurora:'radial-gradient(ellipse at 10% 10%,#c4b5fd 0,transparent 42%),radial-gradient(ellipse at 90% 15%,#67e8f9 0,transparent 38%),linear-gradient(135deg,#eef2ff,#f0fdfa)',ocean:'radial-gradient(ellipse at 15% 15%,#7dd3fc 0,transparent 42%),linear-gradient(135deg,#dbeafe,#cffafe 55%,#ecfeff)',sunset:'radial-gradient(ellipse at 80% 15%,#fda4af 0,transparent 42%),linear-gradient(135deg,#ffedd5,#fce7f3 55%,#ede9fe)',forest:'radial-gradient(ellipse at 12% 15%,#86efac 0,transparent 42%),linear-gradient(135deg,#dcfce7,#d1fae5 55%,#ecfccb)',space:'radial-gradient(ellipse at 80% 12%,#7c3aed 0,transparent 38%),linear-gradient(135deg,#172554,#312e81 55%,#0f172a)',minimal:'linear-gradient(135deg,#f8fafc,#e2e8f0)'};let theme={mode:'light',accent:'#635bff',background:'aurora',animated:false,backgroundImage:''};function paint(){root.dataset.theme=theme.mode==='dark'?'dark':'light';root.style.setProperty('--primary',/^#[0-9a-f]{6}$/i.test(theme.accent||'')?theme.accent:'#635bff');const bg=theme.backgroundImage&&/^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(theme.backgroundImage)?'linear-gradient(#0f172a22,#0f172a22),url("'+theme.backgroundImage+'")':(bgs[theme.background]||bgs.aurora);document.body.style.setProperty('--account-page-bg',bg);document.body.classList.add('account-themed');document.body.classList.toggle('theme-animated',!!theme.animated&&!theme.backgroundImage&&theme.background!=='minimal');try{localStorage.setItem(key,theme.mode)}catch{}btn.textContent=theme.mode==='dark'?'☀️':'🌙';btn.title=theme.mode==='dark'?'Переключить на светлую тему':'Переключить на тёмную тему';btn.setAttribute('aria-label',btn.title)}async function save(){try{const r=await fetch('/api/preferences',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme})});if(!r.ok)throw Error('HTTP '+r.status)}catch(e){console.warn('Theme save failed',e)}}btn.disabled=true;try{const r=await fetch('/api/preferences',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(data.theme&&typeof data.theme==='object')theme={...theme,...data.theme}}catch(e){try{const saved=localStorage.getItem(key);if(saved==='dark'||saved==='light')theme.mode=saved}catch{}}paint();btn.disabled=false;btn.addEventListener('click',()=>{if(btn.disabled)return;theme.mode=theme.mode==='dark'?'light':'dark';paint();save()});})();</script></body></html>
