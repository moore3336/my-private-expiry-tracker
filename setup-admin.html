<!doctype html><html lang="ru"><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3"><link rel="shortcut icon" href="/favicon.svg?v=3"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Первичная настройка</title><style>body{background:#101827;color:#eef4ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.p{max-width:420px;background:#1b293d;padding:26px;border-radius:16px}input,button{display:block;width:100%;padding:12px;margin:10px 0;border-radius:8px;font:inherit}input{background:#101c2c;color:white;border:1px solid #52647d}button{background:#79b5ff;border:0}</style><main class="p"><h2>Создать аккаунт владельца</h2><p>Введите одноразовый BOOTSTRAP_TOKEN из настроек Railway и придумайте новый пароль.</p><form id="f"><input name="token" placeholder="Ключ настройки" required><input name="username" value="moore" required><input name="password" type="password" minlength="12" placeholder="Новый пароль (12+ символов)" required><button>Создать администратора</button></form><p id="msg"></p></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/setup-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),j=await r.json();msg.textContent=r.ok?'Аккаунт создан. Переходим…':j.error||'Ошибка';if(r.ok)setTimeout(()=>location='/app',1000)}</script></html>
