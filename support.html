<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поддержка — Трекер</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:780px;margin:30px auto;padding:0 15px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.btn{padding:10px 14px;border:1px solid #dbe3ef;border-radius:10px;background:white;font-weight:650;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#2563eb;color:white;border-color:#2563eb}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea{width:100%;padding:11px;border:1px solid #dbe3ef;border-radius:9px;font:inherit}.field textarea{min-height:110px}.muted{color:#64748b}.ticket{padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;cursor:pointer}.msg{white-space:pre-wrap;padding:11px;border-radius:10px;margin:7px 0;background:#f1f5f9}.msg.user{background:#eff6ff}.msg.admin{background:#ecfdf5}.msg.ai{background:#f5f3ff}.hidden{display:none}</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>💬 Поддержка</h1><a class="btn" href="/app">← На сайт</a></div><section class="card"><h2>Написать в поддержку</h2><p class="muted">Опиши вопрос — сообщение попадёт в службу поддержки. Если ИИ подключён, он попробует ответить автоматически.</p><div class="field"><label>Тема обращения</label><input id="subject" maxlength="120" placeholder="Например, не получается добавить продукт"></div><div class="field"><label>Сообщение</label><textarea id="message" maxlength="4000" placeholder="Опиши, что произошло…"></textarea></div><button id="send" class="btn primary">Отправить</button><p id="note" class="muted"></p></section><section class="card"><h2>Мои обращения</h2><div id="tickets" class="muted">Загрузка…</div></section><section id="thread" class="card hidden"><h2 id="threadTitle"></h2><div id="messages"></div><div class="field"><label>Ответить</label><textarea id="reply" maxlength="4000"></textarea></div><button id="sendReply" class="btn primary">Отправить ответ</button></section></main><script>(()=>{const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let tickets=[],messages=[],active=0;async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json"}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Ошибка запроса");return j}function renderThread(){const t=tickets.find(x=>String(x.id)===String(active));if(!t)return;$("thread").classList.remove("hidden");$("threadTitle").textContent="#"+t.id+" · "+t.subject+" · "+t.status;$("messages").innerHTML=messages.filter(m=>String(m.ticket_id)===String(active)).map(m=>'<div class="msg '+m.sender_type+'"><b>'+({user:"Вы",admin:"Поддержка",ai:"ИИ-помощник"}[m.sender_type]||m.sender_type)+'</b><div>'+esc(m.body)+'</div><small>'+new Date(m.created_at).toLocaleString("ru-RU")+'</small></div>').join("");$("reply").disabled=t.status==="closed";$("sendReply").disabled=t.status==="closed"}async function load(){const j=await api("/api/support");tickets=j.tickets;messages=j.messages;$("tickets").innerHTML=tickets.map(t=>'<div class="ticket" data-id="'+t.id+'"><b>#'+t.id+" · "+esc(t.subject)+'</b><div class="muted">'+esc(t.status)+" · "+new Date(t.updated_at).toLocaleString("ru-RU")+'</div></div>').join("")||"Обращений пока нет.";document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{active=Number(x.dataset.id);renderThread()})}async function send(ticket_id){const message=$("message").value.trim();if(!message)return $("note").textContent="Напиши сообщение.";const j=await api("/api/support",{method:"POST",body:JSON.stringify({ticket_id:ticket_id||undefined,subject:$("subject").value,message})});$("message").value="";$("subject").value="";$("note").textContent=j.ai_replied?"ИИ-помощник уже ответил.":"Сообщение доставлено. Ответ появится в этом обращении.";await load();active=j.ticket_id;renderThread()}$("send").onclick=()=>send(0).catch(e=>$("note").textContent=e.message);$("sendReply").onclick=async()=>{try{$("message").value=$("reply").value;await send(active);$("reply").value=""}catch(e){$("note").textContent=e.message}};load().catch(e=>$("tickets").textContent=e.message)})();</script></body></html>
