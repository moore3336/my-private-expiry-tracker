<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поддержка — Трекер</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:780px;margin:30px auto;padding:0 15px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.btn{padding:10px 14px;border:1px solid #dbe3ef;border-radius:10px;background:white;font-weight:650;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#2563eb;color:white;border-color:#2563eb}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea{width:100%;padding:11px;border:1px solid #dbe3ef;border-radius:9px;font:inherit}.field textarea{min-height:110px}.muted{color:#64748b}.ticket{padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;cursor:pointer}.msg{white-space:pre-wrap;padding:11px;border-radius:10px;margin:7px 0;background:#f1f5f9}.msg.user{background:#eff6ff}.msg.admin{background:#ecfdf5}.msg.ai{background:#f5f3ff}.hidden{display:none}
:root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark} :root[data-theme="dark"] body{background:#0b1220!important;color:#e5edf8!important} :root[data-theme="dark"] .card,:root[data-theme="dark"] .p,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .widget,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .ticket,:root[data-theme="dark"] .item,:root[data-theme="dark"] .entry{background:#131d2e!important;color:#e5edf8!important;border-color:#29384e!important;box-shadow:0 10px 28px #0003} :root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#182438!important;color:#e5edf8!important;border-color:#35465f!important} :root[data-theme="dark"] .btn,:root[data-theme="dark"] .tabs button{background:#182438;color:#e5edf8;border-color:#35465f} :root[data-theme="dark"] .muted,:root[data-theme="dark"] .hint,:root[data-theme="dark"] .sub{color:#9aabc2!important} :root[data-theme="dark"] .msg{background:#202d42!important;color:#e5edf8} :root[data-theme="dark"] .msg.user{background:#18345a!important} :root[data-theme="dark"] .msg.admin{background:#163b32!important} :root[data-theme="dark"] .msg.ai{background:#30264d!important} .global-theme{position:fixed;right:16px;top:14px;z-index:1200;border:1px solid #94a3b8;background:#fff;color:#172033;border-radius:999px;padding:9px 13px;font:600 14px system-ui;box-shadow:0 5px 18px #0002;cursor:pointer} :root[data-theme="dark"] .global-theme{background:#182438;color:#e5edf8;border-color:#465a75}

/* Unified modern visual language */
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:-.01em;background:radial-gradient(ellipse at 5% 0%,#dbeafe 0,transparent 35%),radial-gradient(ellipse at 95% 5%,#f3e8ff 0,transparent 30%),#f3f6fb!important}body:has(.global-theme){} .card,.p{border-radius:22px!important;box-shadow:0 18px 48px #17255412!important}button,.btn{border-radius:13px!important;font-weight:700!important;transition:transform .16s ease,box-shadow .16s ease!important}button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #635bff20}input,textarea,select{border-radius:13px!important}h1,h2{letter-spacing:-.035em} :root[data-theme="dark"] body{background:radial-gradient(ellipse at 5% 0%,#1e2c52 0,transparent 35%),radial-gradient(ellipse at 95% 5%,#30224a 0,transparent 30%),#0b1220!important;color:#e5edf8!important} @media(max-width:600px){.wrap{padding-top:62px!important}.p{padding:22px!important}}
</style><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style id="account-theme-style">#globalTheme,#theme{display:none!important}#accountThemeToggle{position:fixed;right:16px;top:14px;z-index:1300;border:1px solid #94a3b8;background:#fff;color:#172033;border-radius:999px;padding:9px 13px;font:700 14px system-ui;box-shadow:0 5px 18px #0002;cursor:pointer}:root[data-theme="dark"] #accountThemeToggle{background:#182438;color:#e5edf8;border-color:#465a75}body.account-themed{background-image:var(--account-page-bg)!important;background-size:cover!important;background-attachment:fixed!important}body.account-themed.theme-animated{background-size:220% 220%!important;animation:accountThemeDrift 22s ease infinite}@keyframes accountThemeDrift{0%,100%{background-position:0% 40%}50%{background-position:100% 60%}}@media(prefers-reduced-motion:reduce){body.account-themed.theme-animated{animation:none!important}}</style></head><body><button id="globalTheme" class="global-theme" type="button">🌙 Тёмная тема</button><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>💬 Поддержка</h1><span class="muted">★ Создатель сайта — moore</span><a class="btn" href="/app">← На сайт</a></div><section class="card"><h2>Написать в поддержку</h2><p class="muted">Опиши вопрос — сообщение попадёт в службу поддержки. Если ИИ подключён, он попробует ответить автоматически.</p><div class="field"><label>Тема обращения</label><input id="subject" maxlength="120" placeholder="Например, не получается добавить продукт"></div><div class="field"><label>Сообщение</label><textarea id="message" maxlength="4000" placeholder="Опиши, что произошло…"></textarea></div><button id="send" class="btn primary">Отправить</button><p id="note" class="muted"></p></section><section class="card"><h2>Мои обращения</h2><div id="tickets" class="muted">Загрузка…</div></section><section id="thread" class="card hidden"><h2 id="threadTitle"></h2><div id="messages"></div><div class="field"><label>Ответить</label><textarea id="reply" maxlength="4000"></textarea></div><button id="sendReply" class="btn primary">Отправить ответ</button></section></main><script>(()=>{const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let tickets=[],messages=[],active=0;async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json"}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Ошибка запроса");return j}function renderThread(){const t=tickets.find(x=>String(x.id)===String(active));if(!t)return;$("thread").classList.remove("hidden");$("threadTitle").textContent="#"+t.id+" · "+t.subject+" · "+t.status;$("messages").innerHTML=messages.filter(m=>String(m.ticket_id)===String(active)).map(m=>'<div class="msg '+m.sender_type+'"><b>'+({user:"Вы",admin:"Поддержка",ai:"ИИ-помощник"}[m.sender_type]||m.sender_type)+'</b><div>'+esc(m.body)+'</div><small>'+new Date(m.created_at).toLocaleString("ru-RU")+'</small></div>').join("");$("reply").disabled=t.status==="closed";$("sendReply").disabled=t.status==="closed"}async function load(){const j=await api("/api/support");tickets=j.tickets;messages=j.messages;$("tickets").innerHTML=tickets.map(t=>'<div class="ticket" data-id="'+t.id+'"><b>#'+t.id+" · "+esc(t.subject)+'</b><div class="muted">'+esc(t.status)+" · "+new Date(t.updated_at).toLocaleString("ru-RU")+'</div></div>').join("")||"Обращений пока нет.";document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{active=Number(x.dataset.id);renderThread()})}async function send(ticket_id){const message=$("message").value.trim();if(!message)return $("note").textContent="Напиши сообщение.";const j=await api("/api/support",{method:"POST",body:JSON.stringify({ticket_id:ticket_id||undefined,subject:$("subject").value,message})});$("message").value="";$("subject").value="";$("note").textContent=j.ai_replied?"ИИ-помощник уже ответил.":"Сообщение доставлено. Ответ появится в этом обращении.";await load();active=j.ticket_id;renderThread()}$("send").onclick=()=>send(0).catch(e=>$("note").textContent=e.message);$("sendReply").onclick=async()=>{try{$("message").value=$("reply").value;await send(active);$("reply").value=""}catch(e){$("note").textContent=e.message}};load().catch(e=>$("tickets").textContent=e.message)})();</script><script>(()=>{const root=document.documentElement,key='expiry-theme';let t=localStorage.getItem(key)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t;const b=document.getElementById('globalTheme');const paint=()=>{b.textContent=root.dataset.theme==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'};paint();b.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem(key,root.dataset.theme);paint()})})();</script><button id="accountThemeToggle" type="button" aria-label="Переключить тему">🌙 Тёмная тема</button><script id="account-theme-loader">(()=>{const root=document.documentElement,btn=document.getElementById('accountThemeToggle'),key='expiry-theme';const bgs={aurora:'radial-gradient(ellipse at 10% 10%,#c4b5fd 0,transparent 42%),radial-gradient(ellipse at 90% 15%,#67e8f9 0,transparent 38%),linear-gradient(135deg,#eef2ff,#f0fdfa)',ocean:'radial-gradient(ellipse at 15% 15%,#7dd3fc 0,transparent 42%),linear-gradient(135deg,#dbeafe,#cffafe 55%,#ecfeff)',sunset:'radial-gradient(ellipse at 80% 15%,#fda4af 0,transparent 42%),linear-gradient(135deg,#ffedd5,#fce7f3 55%,#ede9fe)',forest:'radial-gradient(ellipse at 12% 15%,#86efac 0,transparent 42%),linear-gradient(135deg,#dcfce7,#d1fae5 55%,#ecfccb)',space:'radial-gradient(ellipse at 80% 12%,#7c3aed 0,transparent 38%),linear-gradient(135deg,#172554,#312e81 55%,#0f172a)',minimal:'linear-gradient(135deg,#f8fafc,#e2e8f0)'};let theme={mode:localStorage.getItem(key)||'light',accent:'#635bff',background:'aurora',animated:false,backgroundImage:''};function paint(){root.dataset.theme=theme.mode;root.style.setProperty('--primary',/^#[0-9a-f]{6}$/i.test(theme.accent||'')?theme.accent:'#635bff');const bg=theme.backgroundImage&&/^data:image\/(png|jpeg|webp);base64,/i.test(theme.backgroundImage)?'linear-gradient(#0f172a22,#0f172a22),url("'+theme.backgroundImage+'")':(bgs[theme.background]||bgs.aurora);document.body.style.setProperty('--account-page-bg',bg);document.body.classList.add('account-themed');document.body.classList.toggle('theme-animated',!!theme.animated&&!theme.backgroundImage&&theme.background!=='minimal');localStorage.setItem(key,theme.mode);btn.textContent=theme.mode==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'}async function save(){try{const r=await fetch('/api/preferences',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme})});if(!r.ok)throw Error('save failed')}catch(e){console.warn('Theme save failed',e)}}btn.addEventListener('click',()=>{theme.mode=theme.mode==='dark'?'light':'dark';paint();save()});paint();fetch('/api/preferences',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error('load failed');return r.json()}).then(r=>{if(r.theme&&typeof r.theme==='object')theme={...theme,...r.theme};paint()}).catch(()=>{});})();</script></body></html>
