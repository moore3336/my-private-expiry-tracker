lign:center;text-decoration:none;padding:13px;display:block;border-radius:8px;margin-top:10px}.g[hidden],.g[style*="display: none"]{display:none!important}.tabs{display:flex;gap:8px}.tabs button{background:#40516b!important;color:#fff!important}.msg{color:#ffb4b4}

/* Theme-aware authentication controls */
:root{--auth-bg:#f3f6fb;--auth-card:#fff;--auth-text:#172033;--auth-muted:#52647d;--auth-tab:#e8edf5;--auth-tab-hover:#dce4ef;--auth-button:#79b5ff;--auth-button-text:#0b1b2d;--auth-border:#cbd5e1}
:root[data-theme="dark"]{--auth-bg:#0b1220;--auth-card:#131d2e;--auth-text:#e5edf8;--auth-muted:#a9b8cc;--auth-tab:#182438;--auth-tab-hover:#26364e;--auth-button:#365f91;--auth-button-text:#fff;--auth-border:#35465f}
body{background:var(--auth-bg)!important;color:var(--auth-text)!important}
.p{background:var(--auth-card)!important;color:var(--auth-text)!important}
.tabs{background:var(--auth-tab)!important}
.tabs button{background:var(--auth-tab)!important;color:var(--auth-muted)!important;border:1px solid var(--auth-border)!important;box-shadow:none!important}
.tabs button:hover{background:var(--auth-tab-hover)!important;color:var(--auth-text)!important}
.tabs button[aria-pressed="true"]{background:var(--auth-button)!important;color:var(--auth-button-text)!important;border-color:transparent!important;box-shadow:0 2px 8px #17255418!important}
.p form button{background:var(--auth-button)!important;color:var(--auth-button-text)!important;border:0!important}
.p form button:disabled{opacity:.7;cursor:wait}
.global-theme{background:var(--auth-card)!important;color:var(--auth-text)!important;border-color:var(--auth-border)!important}
.global-theme{position:fixed!important;right:14px!important;top:14px!important;z-index:1400!important;width:38px!important;height:38px!important;min-width:38px!important;padding:0!important;margin:0!important;display:grid!important;place-items:center!important;border:1px solid var(--auth-border)!important;border-radius:50%!important;background:var(--auth-card)!important;color:var(--auth-text)!important;font:600 18px/1 system-ui!important;box-shadow:0 4px 14px #0002!important;transform:none!important}.global-theme:hover{transform:scale(1.04)!important}.global-theme:disabled{opacity:.65;cursor:wait}</style><button id="globalTheme" class="global-theme" type="button" aria-label="Переключить тему" title="Переключить тему">🌙</button><main class="p"><h1>🥫 Сроки годности</h1><p>Создайте аккаунт или войдите. Ваш список продуктов будет личным.</p><p style="font-size:13px;opacity:.75;text-align:center">★ Создатель сайта — moore</p><div class="tabs"><button onclick="mode='login';draw()">Войти</button><button onclick="mode='register';draw()">Регистрация</button></div><div id="form"></div><p id="msg" class="msg"></p></main><script>
let mode=location.pathname==='/register'?'register':'login';
const formRoot=document.getElementById('form'),message=document.getElementById('msg');
function draw(){
document.querySelectorAll('.tabs button').forEach((button,index)=>button.setAttribute('aria-pressed',String((index===0&&mode==='login')||(index===1&&mode==='register'))));
formRoot.innerHTML='<form id="accountForm" novalidate><input name="username" placeholder="'+(mode==='register'?'Логин (3–32 символа)':'Логин или email')+'" required minlength="3" maxlength="'+(mode==='register'?32:254)+'" autocomplete="username">'+(mode==='register'?'<input name="email" type="email" placeholder="Email (необязательно)" autocomplete="email">':'')+'<input name="password" type="password" placeholder="Пароль (минимум 10 символов)" minlength="'+(mode==='register'?10:1)+'" maxlength="200" required autocomplete="'+(mode==='register'?'new-password':'current-password')+'"><button type="submit">'+(mode==='register'?'Создать аккаунт':'Войти')+'</button></form>';
const accountForm=document.getElementById('accountForm');
accountForm.onsubmit=async event=>{
event.preventDefault();message.textContent='';
const data=Object.fromEntries(new FormData(accountForm));
if(mode==='register'){
data.username=(data.username||'').normalize('NFC').trim();
if(Array.from(data.username).length<3||Array.from(data.username).length>32){message.textContent='Логин должен содержать от 3 до 32 символов.';return;}
if(!/^[\p{L}\p{N}_.-]+$/u.test(data.username)){message.textContent='В логине разрешены буквы (в том числе русские), цифры, точка, дефис и подчёркивание.';return;}
if((data.password||'').length<10){message.textContent='Пароль должен содержать минимум 10 символов.';return;}
}
const submit=accountForm.querySelector('button');submit.disabled=true;submit.textContent='Подождите…';
try{
const response=await fetch('/api/'+mode,{cache:'no-store',method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
const result=await response.json().catch(()=>({}));
if(response.ok){location.href=mode==='register'?'/welcome':'/app';return;}
message.textContent=result.error||(response.status===429?'Слишком много попыток. Подождите немного и попробуйте снова.':'Не удалось выполнить запрос. Проверьте данные.');
}catch(error){message.textContent='Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз.';}
finally{submit.disabled=false;submit.textContent=mode==='register'?'Создать аккаунт':'Войти';}
};
}
draw();
</script><script></script><script id="unified-theme-controller">
(()=> {
 const btn=document.getElementById('globalTheme')||document.getElementById('theme');
 if(!btn)return;
 const root=document.documentElement,authPage=!!document.getElementById('accountForm'),key='expiry-theme';
 const backgrounds={aurora:'radial-gradient(ellipse at 10% 10%,#c4b5fd 0,transparent 42%),radial-gradient(ellipse at 90% 15%,#67e8f9 0,transparent 38%),linear-gradient(135deg,#eef2ff,#f0fdfa)',ocean:'radial-gradient(ellipse at 15% 15%,#7dd3fc 0,transparent 42%),linear-gradient(135deg,#dbeafe,#cffafe 55%,#ecfeff)',sunset:'radial-gradient(ellipse at 80% 15%,#fda4af 0,transparent 42%),linear-gradient(135deg,#ffedd5,#fce7f3 55%,#ede9fe)',forest:'radial-gradient(ellipse at 12% 15%,#86efac 0,transparent 42%),linear-gradient(135deg,#dcfce7,#d1fae5 55%,#ecfccb)',space:'radial-gradient(ellipse at 80% 12%,#7c3aed 0,transparent 38%),linear-gradient(135deg,#172554,#312e81 55%,#0f172a)',minimal:'linear-gradient(135deg,#f8fafc,#e2e8f0)'};
 let theme={mode:'light',accent:'#635bff',background:'aurora',animated:true,backgroundImage:''};
 const readLocal=()=>{try{const v=localStorage.getItem(key);if(v==='dark'||v==='light')theme.mode=v}catch{}};
 function paint(){
  theme.mode=theme.mode==='dark'?'dark':'light';root.dataset.theme=theme.mode;
  root.style.setProperty('--primary',/^#[0-9a-f]{6}$/i.test(theme.accent||'')?theme.accent:'#635bff');
  const bg=theme.backgroundImage&&/^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(theme.backgroundImage)?'linear-gradient(#0f172a22,#0f172a22),url("'+theme.backgroundImage+'")':(backgrounds[theme.background]||backgrounds.aurora);
  root.style.setProperty('--page-background',bg);root.style.setProperty('--account-page-bg',bg);
  if(document.body.classList.contains('account-themed'))document.body.style.backgroundImage=bg;
  document.body.classList.toggle('theme-animated',!!theme.animated&&!theme.backgroundImage&&theme.background!=='minimal');
  btn.textContent=theme.mode==='dark'?'☀️':'🌙';btn.title=theme.mode==='dark'?'Переключить на светлую тему':'Переключить на тёмную тему';btn.setAttribute('aria-label',btn.title);
 }
 async function init(){btn.disabled=true;readLocal();if(!authPage){try{const r=await fetch('/api/preferences',{credentials:'same-origin',cache:'no-store'});if(r.ok){const data=await r.json();if(data.theme&&Object.keys(data.theme).length)theme={...theme,...data.theme}}}catch(e){console.warn('Theme preferences unavailable',e)}}try{localStorage.setItem(key,theme.mode)}catch{}paint();btn.disabled=false}
 document.addEventListener('click',async event=>{const target=event.target instanceof Element?event.target.closest('#globalTheme,#theme'):null;if(!target)return;event.preventDefault();event.stopImmediatePropagation();if(btn.disabled)return;btn.disabled=true;theme.mode=theme.mode==='dark'?'light':'dark';paint();try{localStorage.setItem(key,theme.mode)}catch{}try{if(!authPage){const r=await fetch('/api/preferences',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||('HTTP '+r.status));if(data.theme)theme={...theme,...data.theme};paint()}}catch(error){console.warn('Theme save failed',error);btn.title='Тема изменена в этом браузере, но не сохранена в аккаунте';btn.setAttribute('aria-label',btn.title)}finally{btn.disabled=false}},true);
 window.addEventListener('storage',event=>{if(event.key===key&&(event.newValue==='dark'||event.newValue==='light')){theme.mode=event.newValue;paint()}});
 init();
})();
</script></html>
