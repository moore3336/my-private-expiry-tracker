<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сроки годности — аккаунт</title><style>body{background:#101827;color:#eef4ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.p{width:min(420px,100%);background:#1b293d;padding:28px;border-radius:16px}input,button{display:block;width:100%;padding:13px;margin:10px 0;border-radius:8px;font:inherit}input{background:#101c2c;color:white;border:1px solid #52647d}button,.g{background:#79b5ff;color:#0b1b2d;border:0;text-align:center;text-decoration:none;padding:13px;display:block;border-radius:8px;margin-top:10px}.tabs{display:flex;gap:8px}.tabs button{background:#40516b;color:white}.msg{color:#ffb4b4}</style><main class="p"><h1>🥫 Сроки годности</h1><p>Создайте аккаунт или войдите. Ваш список продуктов будет личным.</p><div class="tabs"><button onclick="mode='login';draw()">Войти</button><button onclick="mode='register';draw()">Регистрация</button></div><div id="form"></div><a class="g" href="/auth/google">Продолжить через Google</a><p id="msg" class="msg"></p></main><script>let mode=location.pathname==='/register'?'register':'login';function draw(){form.innerHTML='<form id="f"><input name="username" placeholder="Логин или email" required autocomplete="username">'+(mode==='register'?'<input name="email" type="email" placeholder="Email (необязательно)">':'')+'<input name="password" type="password" placeholder="Пароль" minlength="'+(mode==='register'?10:1)+'" required autocomplete="'+(mode==='register'?'new-password':'current-password')+'"><button>'+(mode==='register'?'Создать аккаунт':'Войти')+'</button></form>';f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),j=await r.json();if(r.ok)location.href='/app';else msg.textContent=j.error||'Ошибка'}}draw()</script></html>
