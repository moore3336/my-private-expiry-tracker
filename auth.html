<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сроки годности — аккаунт</title><style>body{background:#101827;color:#eef4ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.p{width:min(420px,100%);background:#1b293d;padding:28px;border-radius:16px}input,button{display:block;width:100%;padding:13px;margin:10px 0;border-radius:8px;font:inherit}input{background:#101c2c;color:white;border:1px solid #52647d}button,.g{background:#79b5ff;color:#0b1b2d;border:0;text-align:center;text-decoration:none;padding:13px;display:block;border-radius:8px;margin-top:10px}.tabs{display:flex;gap:8px}.tabs button{background:#40516b;color:white}.msg{color:#ffb4b4}</style><main class="p"><h1>🥫 Сроки годности</h1><p>Создайте аккаунт или войдите. Ваш список продуктов будет личным.</p><div class="tabs"><button onclick="mode='login';draw()">Войти</button><button onclick="mode='register';draw()">Регистрация</button></div><div id="form"></div><p id="msg" class="msg"></p></main><script>
let mode=location.pathname==='/register'?'register':'login';
const formRoot=document.getElementById('form'),message=document.getElementById('msg');
function draw(){
formRoot.innerHTML='<form id="accountForm" novalidate><input name="username" placeholder="'+(mode==='register'?'Логин (3–32 символа)':'Логин или email')+'" required minlength="3" maxlength="32" autocomplete="username">'+(mode==='register'?'<input name="email" type="email" placeholder="Email (необязательно)" autocomplete="email">':'')+'<input name="password" type="password" placeholder="Пароль (минимум 10 символов)" minlength="'+(mode==='register'?10:1)+'" maxlength="200" required autocomplete="'+(mode==='register'?'new-password':'current-password')+'"><button type="submit">'+(mode==='register'?'Создать аккаунт':'Войти')+'</button></form>';
const accountForm=document.getElementById('accountForm');
accountForm.onsubmit=async event=>{
event.preventDefault();message.textContent='';
const data=Object.fromEntries(new FormData(accountForm));
if(mode==='register'){
data.username=(data.username||'').normalize('NFC').trim();
if(Array.from(data.username).length<3||Array.from(data.username).length>32){message.textContent='Логин должен содержать от 3 до 32 символов.';return;}
if(!/^[\\p{L}\\p{N}_.-]+$/u.test(data.username)){message.textContent='В логине разрешены буквы (в том числе русские), цифры, точка, дефис и подчёркивание.';return;}
if((data.password||'').length<10){message.textContent='Пароль должен содержать минимум 10 символов.';return;}
}
const submit=accountForm.querySelector('button');submit.disabled=true;submit.textContent='Подождите…';
try{
const response=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
const result=await response.json().catch(()=>({}));
if(response.ok){location.href='/app';return;}
message.textContent=result.error||(response.status===429?'Слишком много попыток. Подождите немного и попробуйте снова.':'Не удалось выполнить запрос. Проверьте данные.');
}catch(error){message.textContent='Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз.';}
finally{submit.disabled=false;submit.textContent=mode==='register'?'Создать аккаунт':'Войти';}
};
}
draw();
</script></html>
