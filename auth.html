<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сроки годности — аккаунт</title><style>body{background:#101827;color:#eef4ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.p{width:min(420px,100%);background:#1b293d;padding:28px;border-radius:16px}input,button{display:block;width:100%;padding:13px;margin:10px 0;border-radius:8px;font:inherit}input{background:#101c2c;color:white;border:1px solid #52647d}button,.g{background:#79b5ff;color:#0b1b2d;border:0;text-align:center;text-decoration:none;padding:13px;display:block;border-radius:8px;margin-top:10px}.tabs{display:flex;gap:8px}.tabs button{background:#40516b;color:white}.msg{color:#ffb4b4}
:root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark} :root[data-theme="dark"] body{background:#0b1220!important;color:#e5edf8!important} :root[data-theme="dark"] .card,:root[data-theme="dark"] .p,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .widget,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .ticket,:root[data-theme="dark"] .item,:root[data-theme="dark"] .entry{background:#131d2e!important;color:#e5edf8!important;border-color:#29384e!important;box-shadow:0 10px 28px #0003} :root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#182438!important;color:#e5edf8!important;border-color:#35465f!important} :root[data-theme="dark"] .btn,:root[data-theme="dark"] .tabs button{background:#182438;color:#e5edf8;border-color:#35465f} :root[data-theme="dark"] .muted,:root[data-theme="dark"] .hint,:root[data-theme="dark"] .sub{color:#9aabc2!important} :root[data-theme="dark"] .msg{background:#202d42!important;color:#e5edf8} :root[data-theme="dark"] .msg.user{background:#18345a!important} :root[data-theme="dark"] .msg.admin{background:#163b32!important} :root[data-theme="dark"] .msg.ai{background:#30264d!important} .global-theme{position:fixed;right:16px;top:14px;z-index:1200;border:1px solid #94a3b8;background:#fff;color:#172033;border-radius:999px;padding:9px 13px;font:600 14px system-ui;box-shadow:0 5px 18px #0002;cursor:pointer} :root[data-theme="dark"] .global-theme{background:#182438;color:#e5edf8;border-color:#465a75}

</style><button id="globalTheme" class="global-theme" type="button">🌙 Тёмная тема</button><main class="p"><h1>🥫 Сроки годности</h1><p>Создайте аккаунт или войдите. Ваш список продуктов будет личным.</p><p style="font-size:13px;opacity:.75;text-align:center">★ Создатель сайта — moore</p><div class="tabs"><button onclick="mode='login';draw()">Войти</button><button onclick="mode='register';draw()">Регистрация</button></div><div id="form"></div><p id="msg" class="msg"></p></main><script>
let mode=location.pathname==='/register'?'register':'login';
const formRoot=document.getElementById('form'),message=document.getElementById('msg');
function draw(){
formRoot.innerHTML='<form id="accountForm" novalidate><input name="username" placeholder="'+(mode==='register'?'Логин (3–32 символа)':'Логин или email')+'" required minlength="3" maxlength="'+(mode==='register'?32:254)+'" autocomplete="username">'+(mode==='register'?'<input name="email" type="email" placeholder="Email (необязательно)" autocomplete="email">':'')+'<input name="password" type="password" placeholder="Пароль (минимум 10 символов)" minlength="'+(mode==='register'?10:1)+'" maxlength="200" required autocomplete="'+(mode==='register'?'new-password':'current-password')+'"><button type="submit">'+(mode==='register'?'Создать аккаунт':'Войти')+'</button></form>';
const accountForm=document.getElementById('accountForm');
accountForm.onsubmit=async event=>{
event.preventDefault();message.textContent='';
const data=Object.fromEntries(new FormData(accountForm));
if(mode==='register'){
data.username=(data.username||'').normalize('NFC').trim();
if(Array.from(data.username).length<3||Array.from(data.username).length>32){message.textContent='Логин должен содержать от 3 до 32 символов.';return;}
if(!/^[\\p{L}\\p{N}_.-]+$/u.test(data.username)){message.textContent='В логине разрешены буквы (в том числе русские), цифры, точка, дефис и подчёркивание.';return;}
if((data.password||'').length<10){message.textContent='Пароль должен содержать минимум 10 символов.';return;}
}
const submit=accountForm.querySelector('button');submit.disabled=true;submit.textContent='Подождите…';
try{
const response=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
const result=await response.json().catch(()=>({}));
if(response.ok){location.href=mode==='register'?'/welcome':'/app';return;}
message.textContent=result.error||(response.status===429?'Слишком много попыток. Подождите немного и попробуйте снова.':'Не удалось выполнить запрос. Проверьте данные.');
}catch(error){message.textContent='Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз.';}
finally{submit.disabled=false;submit.textContent=mode==='register'?'Создать аккаунт':'Войти';}
};
}
draw();
</script><script>(()=>{const root=document.documentElement,key='expiry-theme';let t=localStorage.getItem(key)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t;const b=document.getElementById('globalTheme');const paint=()=>{b.textContent=root.dataset.theme==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'};paint();b.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem(key,root.dataset.theme);paint()})})();</script></html>
